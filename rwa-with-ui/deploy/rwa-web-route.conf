    # ---- /rwa-enhance -> RWA Enhance ---------------------------------------
    # Added to the rwa-web-1 nginx, which owns port 80 and path-routes for the
    # whole server. Same shape as the /mrm/, /presentation-agent/ and
    # /qa-task-automation/ blocks already in this file. Installed by
    # deploy/add-route-to-rwa-web.sh.
    #
    # `^~` matters: it stops nginx from falling through to the regex asset
    # location further up, which would otherwise try to serve this app's
    # .js/.css from the original RWA container's own document root and 404.
    location = /rwa-enhance { return 301 /rwa-enhance/; }
    location ^~ /rwa-enhance/ {
        resolver 127.0.0.11 valid=30s;
        set $rwa_enhance_upstream rwa-enhance-frontend;
        proxy_pass http://$rwa_enhance_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # One /email-submit walks a whole decision tree — dozens of sequential
        # LLM calls, minutes of wall clock. Matches the 3600s the neighbouring
        # blocks use so the edge is never what gives up first.
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        # Pasted email threads. The server block's own 16m default would be
        # enough today; stated here so this app's ceiling is explicit.
        client_max_body_size  16m;
    }
