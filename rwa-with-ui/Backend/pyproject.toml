[project]
name = "rwa-explainability"
version = "2.0.0"
description = "Agentic explainability for Risk Weighted Asset calculations"
readme = "README.md"
# 3.11+ is enough; nothing here needs 3.13 features.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.9.0",
    "langchain>=0.3.26",
    "langchain-core>=0.3.71",
    "langchain-community>=0.3.27",
    "langchain-openai>=0.3.28",
    "langchain-experimental>=0.3.4",
    "langgraph>=0.5.4",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "tabulate>=0.9.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
# Only for legacy/streamlit_app.py.
legacy-ui = ["streamlit>=1.47.0"]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
