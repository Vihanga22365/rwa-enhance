# Serves the Angular SPA under /rwa-enhance/ and reverse-proxies its API calls
# to the backend container on the internal Docker network.
#
# The whole app lives under a sub-path because port 80 on this server is owned
# by the rwa-web-1 nginx, which path-routes every app on the box. That router
# forwards /rwa-enhance/ here over the shared-edge network; this container
# publishes no host port of its own. The prefix must match APP_BASE_PATH and
# the bundle directory in the Dockerfile.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Docker's embedded DNS, with the backend address held in a variable below.
    # Resolving per request rather than once at startup matters: a plain
    # `proxy_pass http://backend:8000` caches the IP for the life of the worker,
    # so `docker compose up -d backend` alone would leave this nginx proxying to
    # a container that no longer exists, and every API call 502s until the web
    # container is restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Pasted email bodies can be long; the RWA agent takes the whole thread.
    client_max_body_size 16m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # A single /email-submit walks a whole decision tree: dozens of sequential
    # LLM calls (AGENT_RECURSION_LIMIT is 300). Minutes, not seconds. These
    # bounds sit above anything the backend enforces itself, so the backend is
    # always the component that decides a request has taken too long.
    proxy_connect_timeout 60s;
    proxy_send_timeout    900s;
    proxy_read_timeout    900s;

    # Health passthrough for uptime checks, kept under the app's own prefix so
    # it survives the edge router's path matching. FastAPI serves /health at the
    # root, hence the rewritten target.
    location = /rwa-enhance/health {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/health;
        access_log off;
    }

    # A typed-in ".../rwa-enhance" (no trailing slash) has to land on the app
    # rather than a 404. The edge router sends the same redirect, but this is
    # the answer when something reaches this container directly.
    location = /rwa-enhance {
        return 301 /rwa-enhance/;
    }

    # API -> backend. The prefix is stripped here: FastAPI mounts its routes at
    # /api/rwa and knows nothing about where the UI is served from. A regex
    # location rather than a prefix one because proxy_pass cannot both use a
    # variable (see `resolver` above) and rewrite the URI on its own — the
    # captured tail is what does the rewriting.
    #
    # Declared before the asset regex so it is matched first.
    location ~ ^/rwa-enhance/api/(?<api_path>.*)$ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/api/$api_path$is_args$args;
    }

    # Fingerprinted Angular assets (outputHashing = all), safe to cache forever.
    location ~* ^/rwa-enhance/.*\.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any other path under the prefix is a client-side route.
    # index.html itself must never be cached, or a browser keeps loading the
    # previous release's asset hashes after a deploy.
    location /rwa-enhance/ {
        try_files $uri $uri/ /rwa-enhance/index.html;
        add_header Cache-Control "no-store";
    }

    # Anything outside the prefix does not belong to this app. The edge router
    # normally never sends it here; this is the direct-access answer.
    location / {
        return 404;
    }
}
